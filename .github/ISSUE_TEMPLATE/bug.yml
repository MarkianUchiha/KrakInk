name: Bug
description: Algo no funciona / Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó / What happened
      description: Y qué esperabas / and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir / Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de KrakInk / KrakInk version
      placeholder: "1.8.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo y Android / Device and Android version
      placeholder: "Galaxy Tab S9, Android 14, S-Pen"
  - type: textarea
    id: log
    attributes:
      label: Registro de errores / Error log
      description: Configuración → Registro de errores → copiar. Revisa que no tenga datos personales.
      render: text
